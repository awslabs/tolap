version: 2
updates:
  # The core packages intentionally ship zero runtime dependencies, so nearly
  # everything here is test/build tooling. A critical advisory in the test
  # toolchain still matters: it runs on developer and CI machines.
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /sdk/dotnet
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
