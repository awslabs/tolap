name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A stale run on a superseded commit tells you nothing useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job, one run per push. The three SDKs are tested together because the
# guarantees they carry are cross-SDK: a context signed by one must verify in the
# others, and the shared fixtures assert byte-identical output across all three.
# Splitting them into parallel jobs (or version matrices) multiplied the run count
# without testing anything the single run does not, and nothing then asserted the
# three agree *with each other* rather than merely each with itself.
jobs:
  test:
    name: All SDKs + cross-SDK conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tolap_integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: tolap_integration_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      # Postgres uses the .NET connection-string form for the .NET suite and the
      # URL form for Python/TypeScript; both point at the same service container.
      TOLAP_TEST_DB_DSN_DOTNET: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=tolap_integration_test;Include Error Detail=true
      TOLAP_TEST_DB_DSN: postgresql://postgres:postgres@localhost:5432/tolap_integration_test
      TOLAP_TEST_MYSQL_HOST: 127.0.0.1
      TOLAP_TEST_MYSQL_PORT: '3306'
      TOLAP_TEST_MYSQL_USER: root
      TOLAP_TEST_MYSQL_PASSWORD: mysql
      TOLAP_TEST_MYSQL_DB: tolap_integration_test
    steps:
      # Action majors are kept on the Node 24 runtime. GitHub deprecated Node 20 for
      # actions (2025-09-19) and now force-runs Node-20 actions on 24, which is a
      # warning today and a breakage whenever the shim is withdrawn.
      #
      # These are bumped BY HAND. There is no Dependabot config in this repository, so
      # nothing watches them: when a run starts warning about a deprecated runtime, or
      # an action's major goes stale, someone has to raise the pins here.
      - uses: actions/checkout@v5

      # Pinned to the versions the SDKs target: net9.0, requires-python >=3.10 (run
      # on current), Node 18+ (run on current LTS). The dropped 3.10/3.13 and
      # 20/22 matrices tested the language runtimes, not this code; a single current
      # version per language catches the regressions this suite exists to catch.
      #
      # Note the two different things called a Node version here: `node-version: 22`
      # is the runtime the TypeScript SUITE runs under, chosen because the SDK targets
      # Node 18+. The action's own runtime is a separate concern, decided by the action
      # major above.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      # -- .NET --
      - name: .NET restore
        run: dotnet restore sdk/dotnet/Tolap.sln
      - name: .NET build (warnings as errors)
        run: dotnet build sdk/dotnet/Tolap.sln --no-restore -warnaserror
      - name: .NET test
        env:
          TOLAP_TEST_DB_DSN: ${{ env.TOLAP_TEST_DB_DSN_DOTNET }}
        run: dotnet test sdk/dotnet/Tolap.sln --no-build --verbosity normal

      # -- Python --
      - name: Python install
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install ./tolap-core ./tolap-store ./tolap-mcp
          pip install pytest httpx "psycopg[binary]" PyMySQL jsonschema
      - name: Python test
        working-directory: sdk/python
        run: python -m pytest tests/ -v

      # -- TypeScript --
      - name: TypeScript install
        working-directory: sdk/typescript
        run: npm ci
      # MUST precede the typecheck, not follow it. `store` and `mcp` resolve
      # @tolap/core through packages/core/dist, so on a fresh clone — where dist/ does
      # not exist yet — typechecking them first fails with TS6305 ("has not been built
      # from source file") plus a cascade of TS7006 implicit-any errors, because the
      # callback parameter types come from core's .d.ts. This ran green locally only
      # because a developer's dist/ is already built from earlier work; CI starts from
      # nothing, which is exactly the case the ordering has to satisfy.
      - name: TypeScript build core (store and mcp resolve @tolap/core from dist)
        working-directory: sdk/typescript/packages/core
        run: npx tsc -p tsconfig.json

      - name: TypeScript typecheck
        working-directory: sdk/typescript
        run: |
          fail=0
          for pkg in core store mcp; do
            echo "::group::tsc @tolap/$pkg"
            # Not `set -e`-dependent: a subshell failure inside a loop would otherwise
            # abort at the first package and hide the rest, and knowing whether one or
            # all three are broken is the difference between a typo and a bad build.
            (cd "packages/$pkg" && npx tsc --noEmit) || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - name: TypeScript test
        working-directory: sdk/typescript
        run: |
          fail=0
          for pkg in core store mcp; do
            echo "::group::vitest @tolap/$pkg"
            (cd "packages/$pkg" && npx vitest run) || fail=1
            echo "::endgroup::"
          done
          exit $fail

      # -- Policy server --
      #
      # Runs after the SDK suites because it depends on their build output, and
      # after Python/.NET are set up because its cross-SDK test shells out to both.
      - name: Policy server install
        working-directory: server
        run: npm ci

      # The server resolves @tolap/core AND @tolap/store through their dist/
      # directories, so both must be built first. Verified by deleting them and
      # watching tsc report TS2307 for both packages — the same fresh-clone
      # ordering problem documented for store and mcp above, one layer further out.
      # `core` is already built by the step above; `store` is not, because the SDK
      # typecheck only ever type-checks it.
      - name: Build @tolap/store (the server resolves it from dist)
        working-directory: sdk/typescript/packages/store
        run: npx tsc -p tsconfig.json

      - name: Policy server typecheck
        working-directory: server
        run: npx tsc

      # TOLAP_TEST_DB_DSN is set so the store, revocation and endpoint suites
      # actually run. Without it they skip — which is correct for a laptop with no
      # database, and useless in CI. The Postgres service container above is
      # already running, so this is the one place those spec-compliance suites
      # (sections 3 and 12) are guaranteed to execute.
      - name: Policy server test
        working-directory: server
        env:
          TOLAP_TEST_DB_DSN: ${{ env.TOLAP_TEST_DB_DSN }}
        run: npx vitest run

      # Guards against the suites silently skipping. Every DB-backed suite carries
      # a guard test outside its own skip, but nothing asserts that CI supplied the
      # DSN at all — and a run where all of them skipped would report success while
      # testing none of the persistence guarantees. That is the exact defect class
      # recorded under "Test-reporting defects" in the CHANGELOG.
      - name: Policy server DB suites actually ran
        working-directory: server
        env:
          TOLAP_TEST_DB_DSN: ${{ env.TOLAP_TEST_DB_DSN }}
        run: |
          if [ -z "$TOLAP_TEST_DB_DSN" ]; then
            echo "TOLAP_TEST_DB_DSN is empty: the store, revocation and endpoint suites skipped"
            exit 1
          fi
          npx vitest run --reporter=json --outputFile=/tmp/server-tests.json >/dev/null
          python3 - <<'PY'
          import json, sys
          report = json.load(open("/tmp/server-tests.json"))
          skipped = [
              t["fullName"]
              for suite in report["testResults"]
              for t in suite["assertionResults"]
              if t["status"] in ("pending", "skipped")
          ]
          required = ("null vs empty", "revocation", "GET /v1/resolve", "admin API")
          missed = [s for s in skipped if any(r in s for r in required)]
          if missed:
              print("\n".join(missed))
              sys.exit(f"{len(missed)} spec-compliance tests skipped in CI")
          print(f"all spec-compliance suites ran ({len(skipped)} unrelated skips)")
          PY

      # -- Console --
      #
      # Independent of the SDKs: the console talks to the server over HTTP and
      # imports no @tolap package, so it needs no build ordering.
      - name: Console install
        working-directory: console
        run: npm ci
      - name: Console typecheck
        working-directory: console
        run: npx tsc --noEmit
      - name: Console test
        working-directory: console
        run: npx vitest run
      # `tsc -b && vite build`. A console that typechecks but cannot build is not
      # shippable, and the build is where a bad import or asset reference surfaces.
      - name: Console build
        working-directory: console
        run: npm run build

      # The cross-SDK signing conformance lives inside the suites above (each SDK's
      # signing-regression tests assert the shared known-answer fixture byte-for-byte,
      # so a divergence fails there). This step guards the fixtures themselves: a
      # known-answer fixture that loses its expected values would let those tests pass
      # while checking nothing — the exact defect that let the original signing
      # divergence ship (canonical-enforcement-spec §12).
      - name: Signing fixtures carry their expected values
        run: |
          python - <<'PY'
          import json, pathlib, sys
          required = ("secretKey", "payload", "canonicalPayload",
                      "expectedSignature", "expectedSignatureSha512")
          bad = []
          for path in sorted(pathlib.Path("fixtures/signing").glob("*.json")):
              data = json.loads(path.read_text())
              missing = [k for k in required if not data.get(k)]
              if missing:
                  bad.append(f"{path}: missing {', '.join(missing)}")
          if bad:
              print("\n".join(bad))
              sys.exit("signing fixtures must carry expected values (spec §12)")
          print("all signing fixtures carry expected values")
          PY
