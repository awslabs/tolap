name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A stale run on a superseded commit tells you nothing useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET (net9.0)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tolap_integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: tolap_integration_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      TOLAP_TEST_DB_DSN: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=tolap_integration_test;Include Error Detail=true
      TOLAP_TEST_MYSQL_HOST: 127.0.0.1
      TOLAP_TEST_MYSQL_PORT: '3306'
      TOLAP_TEST_MYSQL_USER: root
      TOLAP_TEST_MYSQL_PASSWORD: mysql
      TOLAP_TEST_MYSQL_DB: tolap_integration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore sdk/dotnet/Tolap.sln
      - name: Build (warnings as errors)
        run: dotnet build sdk/dotnet/Tolap.sln --no-restore -warnaserror
      - name: Test
        run: dotnet test sdk/dotnet/Tolap.sln --no-build --verbosity normal

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (requires-python >=3.10) and current.
        python-version: ['3.10', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tolap_integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: tolap_integration_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      TOLAP_TEST_DB_DSN: postgresql://postgres:postgres@localhost:5432/tolap_integration_test
      TOLAP_TEST_MYSQL_HOST: 127.0.0.1
      TOLAP_TEST_MYSQL_PORT: '3306'
      TOLAP_TEST_MYSQL_USER: root
      TOLAP_TEST_MYSQL_PASSWORD: mysql
      TOLAP_TEST_MYSQL_DB: tolap_integration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages and test tooling
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install ./tolap-core ./tolap-store ./tolap-mcp
          pip install pytest httpx "psycopg[binary]" PyMySQL
      - name: Test
        working-directory: sdk/python
        run: python -m pytest tests/ -v

  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tolap_integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: tolap_integration_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      TOLAP_TEST_DB_DSN: postgresql://postgres:postgres@localhost:5432/tolap_integration_test
      TOLAP_TEST_MYSQL_HOST: 127.0.0.1
      TOLAP_TEST_MYSQL_PORT: '3306'
      TOLAP_TEST_MYSQL_USER: root
      TOLAP_TEST_MYSQL_PASSWORD: mysql
      TOLAP_TEST_MYSQL_DB: tolap_integration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install
        working-directory: sdk/typescript
        run: npm ci
      - name: Typecheck
        working-directory: sdk/typescript
        run: |
          for pkg in core store mcp; do
            echo "::group::tsc @tolap/$pkg"
            (cd "packages/$pkg" && npx tsc --noEmit)
            echo "::endgroup::"
          done
      - name: Test
        working-directory: sdk/typescript
        run: |
          fail=0
          for pkg in core store mcp; do
            echo "::group::vitest @tolap/$pkg"
            (cd "packages/$pkg" && npx vitest run) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  # The whole point of the shared fixtures is that the three SDKs agree. This job
  # asserts that directly: each SDK independently recomputes the canonical signing
  # bytes for the known-answer fixtures and must match the committed expected
  # values. A determinism-only check (sign twice, compare to itself) passes even
  # when all three disagree with each other -- which is how a real cross-SDK
  # signing divergence went unnoticed. See docs/canonical-enforcement-spec.md §12.
  cross-sdk-conformance:
    name: Cross-SDK signing conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: .NET conformance
        run: dotnet test sdk/dotnet/Tolap.sln --filter "FullyQualifiedName~SigningConformance" --verbosity normal

      - name: Python conformance
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install ./tolap-core ./tolap-store ./tolap-mcp pytest httpx
          python -m pytest tests/test_signer.py tests/test_signing_regressions.py -v

      - name: TypeScript conformance
        working-directory: sdk/typescript
        run: |
          npm ci
          cd packages/core && npx vitest run tests/signing-regressions.test.ts

      - name: Fixtures carry their expected values
        # Guards against the original defect: a known-answer fixture with nothing
        # to assert. If a fixture loses expectedSignature/canonicalPayload the
        # per-SDK tests above would still pass while checking nothing.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          required = ("secretKey", "payload", "canonicalPayload",
                      "expectedSignature", "expectedSignatureSha512")
          bad = []
          for path in sorted(pathlib.Path("fixtures/signing").glob("*.json")):
              data = json.loads(path.read_text())
              missing = [k for k in required if not data.get(k)]
              if missing:
                  bad.append(f"{path}: missing {', '.join(missing)}")
          if bad:
              print("\n".join(bad))
              sys.exit("signing fixtures must carry expected values (spec §12)")
          print("all signing fixtures carry expected values")
          PY
