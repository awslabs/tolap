name: Token probe
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect both tokens without revealing them
        env:
          LIVE: ${{ secrets.PYPI_API_TOKEN }}
          TEST: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, os, json, urllib.request
          for name in ("LIVE", "TEST"):
              t = os.environ.get(name, "")
              print(f"--- {name}")
              if not t:
                  print("  EMPTY"); continue
              print(f"  length: {len(t)}")
              print(f"  starts 'pypi-': {t.startswith('pypi-')}")
              print(f"  has whitespace/newline: {any(c.isspace() for c in t)}")
              print(f"  first 12 chars: {t[:12]}")
              body = t[5:] if t.startswith("pypi-") else t
              # The macaroon's first field names the site it belongs to.
              try:
                  raw = base64.urlsafe_b64decode(body + "=" * (-len(body) % 4))
                  txt = raw.decode("utf8", "replace")
                  site = "test.pypi.org" if "test.pypi.org" in txt else ("pypi.org" if "pypi.org" in txt else "UNKNOWN")
                  print(f"  token says its site is: {site}")
              except Exception as e:
                  print(f"  could not decode: {e}")
              # Ask each registry who this token is.
              for label, url in (("pypi.org","https://pypi.org/pypi"),("test.pypi.org","https://test.pypi.org/pypi")):
                  pass
          PY
          # Authoritative check: ask the upload endpoint directly.
          for pair in "LIVE:https://upload.pypi.org/legacy/" "TEST:https://test.pypi.org/legacy/"; do
            name="${pair%%:*}"; url="${pair#*:}"
            tok="${!name}"
            [ -z "$tok" ] && { echo "$name empty, skipping"; continue; }
            code=$(curl -s -o /tmp/out -w '%{http_code}' -u "__token__:$tok" -X POST "$url" -F ":action=file_upload" || true)
            echo "$name against $url -> HTTP $code"
            head -c 300 /tmp/out | tr -d '\n' | sed 's/<[^>]*>//g' | cut -c1-200; echo
          done
