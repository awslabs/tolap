name: Publish

# Publishes the nine SDK packages to PyPI, npm and NuGet.
#
# Triggered by a version tag (v1.0.0), or manually with an explicit version for a
# re-run after a partial failure. Tag-and-forget is deliberate: the tag is the record of
# what was released, and it is what the version-agreement gate below checks the manifests
# against.
#
# The nine packages are NOT independently versioned. They ship as a set at one version,
# because the guarantee they carry is cross-package: a context signed by @aws/tolap-core must
# verify in tolap-core and Tolap.Core, and the shared fixtures assert byte-identical
# output across all three languages. Publishing them separately would let a consumer
# combine versions that were never tested against each other.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match the manifests, e.g. 1.0.0)'
        required: true
        type: string
      target:
        description: 'Where to publish'
        required: true
        default: dry-run
        type: choice
        options:
          # Build and validate everything, push nothing.
          - dry-run
          # Real upload to test.pypi.org only. The rehearsal Amazon's PyPI guidance asks
          # for: it exercises the credential path and PyPI's own metadata validation
          # against a registry where a mistake costs nothing. npm and NuGet have no
          # equivalent sandbox, so they are skipped for this target.
          - testpypi
          # The real thing. Normally reached by pushing a tag rather than by hand; this
          # option exists to re-run after a partial failure.
          - live

# Two publish runs for the same tag would race on the same registry coordinates.
# No cancel-in-progress: a half-finished publish that gets killed is worse than one
# that finishes and reports what it did.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: the version in the tag, VERSION, and all nine manifests must agree.
  #
  # This exists because the failure it prevents is unrecoverable. A registry release is
  # immutable: PyPI and npm (after 72 hours, and only under narrow conditions) will not
  # let you replace a published version. Publishing tolap-core 1.0.1 from a tag that says
  # v1.0.0 cannot be undone by a follow-up commit, so the check has to happen before
  # anything is pushed.
  # ---------------------------------------------------------------------------
  verify-version:
    name: Versions agree across tag and manifests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version being released
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            target="${{ inputs.target }}"
          else
            version="${GITHUB_REF_NAME#v}"
            # A tag push is always the real release. `inputs` does not exist on this
            # trigger, so the target is decided here once rather than re-derived in
            # every downstream conditional.
            target="live"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          # Reject anything that is not a bare semver core, optionally with a
          # prerelease suffix. A tag like "v1.0" or "v1.0.0-" would otherwise flow
          # through and produce package versions the three ecosystems disagree about.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not a valid semver version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version to: $target"

      - name: All nine manifests and VERSION carry that version
        env:
          EXPECTED: ${{ steps.resolve.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys

          expected = os.environ["EXPECTED"]
          problems = []

          def check(label, found):
              if found != expected:
                  problems.append(f"{label}: {found!r} != {expected!r}")

          check("VERSION", pathlib.Path("VERSION").read_text().strip())

          for name in ("tolap-core", "tolap-store", "tolap-mcp"):
              p = pathlib.Path("sdk/python") / name / "pyproject.toml"
              m = re.search(r'^version = "([^"]+)"', p.read_text(), re.M)
              check(str(p), m.group(1) if m else None)

          for name in ("core", "store", "mcp"):
              p = pathlib.Path("sdk/typescript/packages") / name / "package.json"
              check(str(p), json.loads(p.read_text())["version"])

          for name in ("Tolap.Core", "Tolap.Store", "Tolap.Mcp"):
              p = pathlib.Path("sdk/dotnet/src") / name / f"{name}.csproj"
              m = re.search(r"<Version>([^<]+)</Version>", p.read_text())
              check(str(p), m.group(1) if m else None)

          # The CHANGELOG must already describe this version. A release whose notes say
          # something else is a release nobody can read.
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          if not re.search(rf"^## {re.escape(expected)}\b", changelog, re.M):
              problems.append(f"CHANGELOG.md has no '## {expected}' section")

          if problems:
              print("\n".join(problems))
              sys.exit("version disagreement: refusing to publish")
          print(f"all manifests, VERSION and CHANGELOG agree on {expected}")
          PY

  # ---------------------------------------------------------------------------
  # Gate 2: the full test suite, on the exact commit being released.
  #
  # CI already runs on push to main, but "it passed on main" is not the same claim as
  # "it passes at this tag". Tags can be moved, cut from a branch, or point at a commit
  # main never saw. This re-runs rather than trusting a prior green.
  # ---------------------------------------------------------------------------
  test:
    name: Full suite at the release commit
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  publish-python:
    name: PyPI build
    needs: [verify-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Build wheels and sdists
        run: |
          python -m pip install --upgrade pip build twine
          for pkg in tolap-core tolap-store tolap-mcp; do
            echo "::group::build $pkg"
            python -m build --outdir dist_all "sdk/python/$pkg"
            echo "::endgroup::"
          done
          ls -la dist_all

      # twine check catches a malformed long_description, which PyPI rejects at upload
      # time. Cheaper to find here than half way through a three-package publish.
      - name: Validate metadata
        run: twine check dist_all/*

      # Guards the compliance property rather than assuming it. `license-files` resolves
      # relative to each pyproject.toml, so a package whose LICENSE copy went missing
      # would build a wheel with no license and no warning.
      - name: Every wheel carries LICENSE and NOTICE
        run: |
          python3 - <<'PY'
          import pathlib, sys, zipfile
          bad = []
          for whl in sorted(pathlib.Path("dist_all").glob("*.whl")):
              names = zipfile.ZipFile(whl).namelist()
              for required in ("licenses/LICENSE", "licenses/NOTICE"):
                  if not any(n.endswith(required) for n in names):
                      bad.append(f"{whl.name}: missing {required}")
          if bad:
              print("\n".join(bad))
              sys.exit("wheels must carry LICENSE and NOTICE")
          print("all wheels carry LICENSE and NOTICE")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dists
          path: dist_all/

  # ---------------------------------------------------------------------------
  # PyPI uploads use trusted publishing: PyPI exchanges this run's short-lived GitHub
  # OIDC token for an upload credential scoped to these three projects, so no PyPI token
  # is stored anywhere. Each project on pypi.org and test.pypi.org must list this
  # repository, this workflow file (publish.yml) and the job's environment as a trusted
  # publisher -- a mismatch fails with "invalid-publisher" before anything is uploaded.
  #
  # Uploading lives in its own job, separate from the build, so the job holding
  # id-token: write runs no build tooling -- the layout pypa recommends. The action also
  # generates Sigstore attestations for every file it uploads.
  #
  # Order within an upload: the action uploads whatever is in dist/, and PyPI resolves
  # dependencies at install time, so the brief window where tolap-store exists without
  # its tolap-core is the same one twine's ordered loop had. skip-existing makes a re-run
  # after a partial failure safe.
  #
  # Test PyPI is the rehearsal Amazon's PyPI guidance asks for: a real upload, so it
  # exercises the credential path and PyPI's server-side metadata validation against a
  # registry where a wrong version costs nothing. It is periodically pruned; nothing
  # downstream should depend on a package there.
  # ---------------------------------------------------------------------------
  upload-testpypi:
    name: Test PyPI upload
    needs: [verify-version, publish-python]
    if: ${{ needs.verify-version.outputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/tolap-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
      - name: Summary
        run: |
          v="${{ needs.verify-version.outputs.version }}"
          {
            echo "### Test PyPI upload complete"
            echo
            echo '```'
            echo "pip install --index-url https://test.pypi.org/simple/ --no-deps tolap-core==$v"
            echo '```'
            echo
            echo "--no-deps matters: dependencies resolve against Test PyPI too, where"
            echo "they are usually absent or stale."
          } >> "$GITHUB_STEP_SUMMARY"

  upload-pypi:
    name: PyPI upload
    needs: [verify-version, publish-python]
    if: ${{ needs.verify-version.outputs.target == 'live' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tolap-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  publish-npm:
    name: npm build
    needs: [verify-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        working-directory: sdk/typescript
        run: npm ci

      # core first: store and mcp resolve @aws/tolap-core through packages/core/dist, so a
      # fresh clone fails with TS6305 if they are built first. Same ordering constraint
      # the CI workflow documents.
      - name: Build
        working-directory: sdk/typescript
        run: |
          for pkg in core store mcp; do
            echo "::group::tsc @aws/tolap-$pkg"
            (cd "packages/$pkg" && npx tsc -p tsconfig.json)
            echo "::endgroup::"
          done

      # `files` in each package.json is an allowlist, and this asserts it held. Without
      # `files`, npm ships everything not gitignored -- for core that was 100 files and
      # 2.1 MB including the test suite. A publish that leaks tests is not a security
      # problem here, but it is a permanent, immutable mistake on the registry.
      - name: Tarballs contain dist and license only
        working-directory: sdk/typescript
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          bad = []
          for pkg in ("core", "store", "mcp"):
              d = pathlib.Path("packages") / pkg
              out = subprocess.run(
                  ["npm", "pack", "--dry-run", "--json"],
                  cwd=d, capture_output=True, text=True, check=True,
              ).stdout
              files = [f["path"] for f in json.loads(out)[0]["files"]]
              for f in files:
                  if not (f.startswith("dist/") or f in ("package.json", "README.md", "LICENSE", "NOTICE")):
                      bad.append(f"@aws/tolap-{pkg}: unexpected {f}")
              for required in ("LICENSE", "NOTICE", "README.md"):
                  if required not in files:
                      bad.append(f"@aws/tolap-{pkg}: missing {required}")
          if bad:
              print("\n".join(bad))
              sys.exit("npm tarball contents are wrong")
          print("all three tarballs contain dist/ plus package.json, README, LICENSE, NOTICE")
          PY

      # Packed here, published from the tarballs in a separate job, so the bytes that
      # were validated above are exactly the bytes that reach the registry.
      - name: Pack
        working-directory: sdk/typescript
        run: |
          mkdir -p ../../npm-tarballs
          for pkg in core store mcp; do
            (cd "packages/$pkg" && npm pack --pack-destination ../../../../npm-tarballs)
          done
          ls -la ../../npm-tarballs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs
          path: npm-tarballs/

  # ---------------------------------------------------------------------------
  # npm publishes with --provenance: npm asks GitHub for this run's OIDC token and
  # records a signed statement, visible on npmjs.com, that each tarball was built from
  # this repository at this commit by this workflow. That is what id-token: write is for.
  # Authentication is the CI publisher token OSPO issues for the @aws scope (NPM_TOKEN).
  #
  # Same dependency ordering as PyPI: store and mcp depend on core.
  #
  # npm has no --skip-existing. A version that already exists exits with EPUBLISHCONFLICT,
  # which on a re-run is success, not failure: the package is on the registry at the
  # right version. Anything else is a real error and stops the job.
  # ---------------------------------------------------------------------------
  upload-npm:
    name: npm upload
    needs: [verify-version, publish-npm]
    if: ${{ needs.verify-version.outputs.target == 'live' }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@aws/tolap-core
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: npm-tarballs/
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set"
            exit 1
          fi
          v="${{ needs.verify-version.outputs.version }}"
          for pkg in core store mcp; do
            echo "::group::publish @aws/tolap-$pkg"
            if out=$(npm publish "npm-tarballs/aws-tolap-$pkg-$v.tgz" --provenance --access public 2>&1); then
              echo "$out"
            else
              echo "$out"
              if printf '%s' "$out" | grep -q "EPUBLISHCONFLICT\|cannot publish over"; then
                echo "@aws/tolap-$pkg is already published at this version; continuing"
              else
                exit 1
              fi
            fi
            echo "::endgroup::"
          done


  publish-nuget:
    name: NuGet build
    needs: [verify-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      # ContinuousIntegrationBuild is set here rather than in the csproj: it normalizes
      # source paths for Source Link, which is right for a released artifact and wrong
      # for a local debug build.
      - name: Pack
        run: |
          for proj in Tolap.Core Tolap.Store Tolap.Mcp; do
            echo "::group::pack $proj"
            dotnet pack "sdk/dotnet/src/$proj/$proj.csproj" \
              -c Release -o nupkgs \
              -p:ContinuousIntegrationBuild=true
            echo "::endgroup::"
          done
          ls -la nupkgs

      # ProjectReference is converted to a package dependency by dotnet pack, but that is
      # a property of the SDK rather than something this repo controls, and getting it
      # wrong ships a package that installs without its core and fails at runtime. Assert it.
      - name: Packages carry license, readme and their dependencies
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, zipfile
          expected_deps = {"Tolap.Store": {"Tolap.Core"},
                           "Tolap.Mcp": {"Tolap.Core", "Tolap.Store"},
                           "Tolap.Core": set()}
          bad = []
          for pkg in sorted(pathlib.Path("nupkgs").glob("*.nupkg")):
              z = zipfile.ZipFile(pkg)
              names = z.namelist()
              pid = pkg.name.rsplit("-", 1)[0].split(".1")[0]
              for required in ("LICENSE", "NOTICE", "README.md"):
                  if required not in names:
                      bad.append(f"{pkg.name}: missing {required}")
              nuspec = next((n for n in names if n.endswith(".nuspec")), None)
              if not nuspec:
                  bad.append(f"{pkg.name}: no nuspec"); continue
              xml = z.read(nuspec).decode("utf-8")
              found = set(re.findall(r'<dependency id="([^"]+)"', xml))
              pid = re.search(r"<id>([^<]+)</id>", xml).group(1)
              missing = expected_deps.get(pid, set()) - found
              if missing:
                  bad.append(f"{pid}: nuspec is missing dependencies {sorted(missing)}")
          if bad:
              print("\n".join(bad))
              sys.exit("nupkg contents are wrong")
          print("all packages carry license, readme and their declared dependencies")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: nupkgs/

  # ---------------------------------------------------------------------------
  # NuGet is opt-in: set the repository variable PUBLISH_NUGET to "true" once a NuGet
  # key for the Tolap.* IDs exists as the NUGET_API_KEY secret. Until then the packages
  # are still built and validated above, and a live release publishes PyPI and npm only.
  #
  # NuGet resolves dependencies at install time rather than publish time, so ordering
  # is less critical than on PyPI -- but a consumer who installs in the gap would see
  # an unresolvable Tolap.Core. Ordered anyway.
  #
  # --skip-duplicate makes re-runs safe, the same property skip-existing gives PyPI.
  # ---------------------------------------------------------------------------
  upload-nuget:
    name: NuGet upload
    needs: [verify-version, publish-nuget]
    if: ${{ needs.verify-version.outputs.target == 'live' && vars.PUBLISH_NUGET == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Tolap.Core
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nupkgs/
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY is not set"
            exit 1
          fi
          v="${{ needs.verify-version.outputs.version }}"
          for proj in Tolap.Core Tolap.Store Tolap.Mcp; do
            echo "::group::push $proj"
            dotnet nuget push "nupkgs/$proj.$v.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # A release is nine packages across three registries, and the jobs above can fail
  # independently. This reports what each registry actually got, so a partial release
  # is visible in the run summary rather than inferred from a wall of job badges.
  # ---------------------------------------------------------------------------
  summary:
    name: Release summary
    if: always()
    needs: [verify-version, publish-python, publish-npm, publish-nuget, upload-testpypi, upload-pypi, upload-npm, upload-nuget]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          TARGET: ${{ needs.verify-version.outputs.target }}
          PUBLISH_NUGET: ${{ vars.PUBLISH_NUGET }}
          BUILD_PYTHON: ${{ needs.publish-python.result }}
          BUILD_NPM: ${{ needs.publish-npm.result }}
          BUILD_NUGET: ${{ needs.publish-nuget.result }}
          UP_TESTPYPI: ${{ needs.upload-testpypi.result }}
          UP_PYPI: ${{ needs.upload-pypi.result }}
          UP_NPM: ${{ needs.upload-npm.result }}
          UP_NUGET: ${{ needs.upload-nuget.result }}
        run: |
          {
            echo "## TOLAP $VERSION ($TARGET)"
            echo
            echo "| Registry | Build and validate | Upload |"
            echo "| --- | --- | --- |"
            echo "| Test PyPI | $BUILD_PYTHON | $UP_TESTPYPI |"
            echo "| PyPI (tolap-core, tolap-store, tolap-mcp) | $BUILD_PYTHON | $UP_PYPI |"
            echo "| npm (@aws/tolap-core, @aws/tolap-store, @aws/tolap-mcp) | $BUILD_NPM | $UP_NPM |"
            echo "| NuGet (Tolap.Core, Tolap.Store, Tolap.Mcp) | $BUILD_NUGET | $UP_NUGET |"
            if [ "$TARGET" != "live" ]; then
              echo
              echo "Nothing was published to a production registry."
            elif [ "$PUBLISH_NUGET" != "true" ]; then
              echo
              echo "NuGet upload is not enabled (repository variable PUBLISH_NUGET)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Every build must pass on every target: they build, validate and assert
          # artifact contents, so a failure there is a real failure even on a dry run.
          failed=""
          for r in "$BUILD_PYTHON" "$BUILD_NPM" "$BUILD_NUGET"; do
            [ "$r" = "success" ] || failed=1
          done
          # Uploads the target asked for must have succeeded. A partial release needs a
          # human, so fail the run rather than let a green check imply it all went out.
          case "$TARGET" in
            testpypi) [ "$UP_TESTPYPI" = "success" ] || failed=1 ;;
            live)
              [ "$UP_PYPI" = "success" ] || failed=1
              [ "$UP_NPM" = "success" ] || failed=1
              if [ "$PUBLISH_NUGET" = "true" ]; then [ "$UP_NUGET" = "success" ] || failed=1; fi
              ;;
          esac
          if [ -n "$failed" ]; then
            if [ "$TARGET" = "live" ]; then
              echo "::error::Partial release. Re-run this workflow with the same version once the cause is fixed; every upload skips what is already on its registry."
            else
              echo "::error::A build, validation or rehearsal job failed. Nothing was published to a production registry."
            fi
            exit 1
          fi
