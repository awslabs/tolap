<text x="290.0" y="856" fill="#B91C1C" font-size="13.5" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">rows: us-east, eu-west, ap-south…</text>
<text x="290.0" y="878" fill="#EF4444" font-size="11.5" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">the restricted data is already here</text>
