<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1044" role="img" aria-label="Both paths clear the same IAM/OAuth check. WITHOUT TOLAP the enforcement slot is empty, so ssn 123-45-6789, a plaintext email and every region land in the agent context window before the guardrails, which run too late. WITH TOLAP an amber wrapper enforces the policy at the source, so the same window holds a dropped ssn, a hashed email and in-region rows, and there is nothing left to leak.">
<rect width="1080" height="1044" fill="#FFFFFF"/>
<defs><marker id="ar-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs>
<rect x="470.0" y="36" width="180" height="50" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
<text x="560.0" y="67" fill="#0F172A" font-size="16" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">User request</text>
<rect x="460.0" y="128" width="200" height="50" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
<text x="560.0" y="159" fill="#0F172A" font-size="16" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">Agent framework</text>
<rect x="400.0" y="242" width="320" height="50" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
<text x="560.0" y="273" fill="#0F172A" font-size="16" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">Tool builds &amp; runs its own query</text>
<line x1="560.0" y1="86" x2="560.0" y2="128" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<line x1="560.0" y1="178" x2="560.0" y2="242" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<text x="586.0" y="205" fill="#64748B" font-size="13" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">IAM / OAuth &#10003;</text>
<text x="586.0" y="222" fill="#64748B" font-size="11.5" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">"may it call this tool?"</text>
<path d="M560.0 292 L560.0 348 M290.0 348 L830.0 348" fill="none" stroke="#64748B" stroke-width="2.5"/>
<line x1="290.0" y1="348" x2="290.0" y2="400" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<line x1="830.0" y1="348" x2="830.0" y2="400" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<text x="560.0" y="376" fill="#64748B" font-size="13" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">same request · same auth · the result comes back</text>
<rect x="70" y="400" width="440" height="636" rx="16" fill="#F8FAFC" stroke="#EF4444" stroke-width="2"/>
<path d="M70 416 a16 16 0 0 1 16 -16 h408 a16 16 0 0 1 16 16 v30 h-440 z" fill="#EF4444"/>
<text x="290.0" y="430" fill="#FFFFFF" font-size="16" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">WITHOUT — the gate slot is empty</text>
<rect x="610" y="400" width="440" height="636" rx="16" fill="#F8FAFC" stroke="#2DD4BF" stroke-width="2"/>
<path d="M610 416 a16 16 0 0 1 16 -16 h408 a16 16 0 0 1 16 16 v30 h-440 z" fill="#2DD4BF"/>
<text x="830.0" y="430" fill="#0B1220" font-size="16" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">WITH TOLAP — the gate sits at the source</text>
<rect x="118.0" y="480" width="344" height="62" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
<text x="290.0" y="502" fill="#64748B" font-size="14" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">Data source</text>
<text x="290.0" y="522" fill="#64748B" font-size="14" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">patients · ssn · email · all regions</text>
<rect x="658.0" y="480" width="344" height="62" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
<text x="830.0" y="502" fill="#64748B" font-size="14" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">Data source</text>
<text x="830.0" y="522" fill="#64748B" font-size="14" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">patients · ssn · email · all regions</text>
<rect x="118.0" y="584" width="344" height="54" rx="10" fill="none" stroke="#FCA5A5" stroke-width="2" stroke-dasharray="6 6"/>
<text x="290.0" y="605" fill="#B91C1C" font-size="13" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">no object-level gate here</text>
<text x="290.0" y="621" fill="#64748B" font-size="11.5" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">IAM already said yes</text>
<rect x="658.0" y="584" width="344" height="54" rx="10" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/>
<text x="830.0" y="604" fill="#0B1220" font-size="13.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">TOLAP wrapper enforces the policy</text>
<text x="830.0" y="621" fill="#0B1220" font-size="11.5" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">columns · rows · fields · tags · endpoints</text>
<line x1="290.0" y1="542" x2="290.0" y2="584" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<line x1="830.0" y1="542" x2="830.0" y2="584" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<rect x="118.0" y="688" width="344" height="108" rx="12" fill="#FEECEC" stroke="#EF4444" stroke-width="2.5"/>
<text x="290.0" y="712" fill="#EF4444" font-size="15" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">Agent context window</text>
<text x="290.0" y="738" fill="#B91C1C" font-size="13.5" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">ssn 123-45-6789  email bob@acme.com</text>
<text x="290.0" y="760" fill="#B91C1C" font-size="13.5" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">rows: us-east, eu-west, ap-south…</text>
<text x="290.0" y="782" fill="#EF4444" font-size="11.5" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">the restricted data is already here</text>
<rect x="658.0" y="688" width="344" height="108" rx="12" fill="#E7FBF6" stroke="#2DD4BF" stroke-width="2.5"/>
<text x="830.0" y="712" fill="#0F766E" font-size="15" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">Agent context window</text>
<text x="830.0" y="738" fill="#0F766E" font-size="13.5" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">ssn —(dropped)  email a1b2c3d4…</text>
<text x="830.0" y="760" fill="#0F766E" font-size="13.5" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">rows: us-east only</text>
<text x="830.0" y="782" fill="#0F766E" font-size="11.5" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">the restricted data never arrived</text>
<line x1="290.0" y1="638" x2="290.0" y2="688" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<text x="304.0" y="667" fill="#64748B" font-size="11.5" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">every row &amp; column returned</text>
<line x1="830.0" y1="638" x2="830.0" y2="688" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<text x="844.0" y="667" fill="#64748B" font-size="11.5" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">only authorized data leaves</text>
<rect x="118.0" y="844" width="344" height="52" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
<text x="290.0" y="871" fill="#64748B" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">Content guardrails on the output</text>
<line x1="290.0" y1="796" x2="290.0" y2="844" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<rect x="658.0" y="844" width="344" height="52" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
<text x="830.0" y="871" fill="#64748B" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">Content guardrails on the output</text>
<line x1="830.0" y1="796" x2="830.0" y2="844" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<rect x="118.0" y="940" width="344" height="56" rx="12" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<line x1="290.0" y1="896" x2="290.0" y2="940" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<text x="290.0" y="963" fill="#FFFFFF" font-size="12.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">too late — a prompt injection or a</text>
<text x="290.0" y="981" fill="#FFFFFF" font-size="12.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">follow-up can still surface it</text>
<rect x="658.0" y="940" width="344" height="56" rx="12" fill="#0F766E" stroke="#0F766E" stroke-width="0"/>
<line x1="830.0" y1="896" x2="830.0" y2="940" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<text x="830.0" y="963" fill="#FFFFFF" font-size="12.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">they run too — but there is</text>
<text x="830.0" y="981" fill="#FFFFFF" font-size="12.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">nothing left to leak</text>
</svg>
