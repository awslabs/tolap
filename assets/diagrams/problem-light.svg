<line x1="560.0" y1="86" x2="560.0" y2="128" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<line x1="560.0" y1="178" x2="560.0" y2="242" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
<text x="586.0" y="205" fill="#64748B" font-size="13" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">IAM / OAuth &#10003;</text>
<text x="586.0" y="222" fill="#64748B" font-size="11.5" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">"may it call this tool?" — same answer for every user</text>
