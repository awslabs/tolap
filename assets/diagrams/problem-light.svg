<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1140" role="img" aria-label="Both paths clear the same IAM/OAuth check. WITHOUT TOLAP both gate slots are empty: every user can call every tool and nothing checks the data, so ssn 123-45-6789, a plaintext email and every region land in the agent context window before the guardrails, which run too late. WITH TOLAP an amber wrapper first checks whether this identity may call the tool at all (toolRules), then enforces the data policy at the source, so the same window holds a dropped ssn, a hashed email and in-region rows, and there is nothing left to leak.">
<rect width="1080" height="1140" fill="#FFFFFF"/>
<defs><marker id="ar-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs>
