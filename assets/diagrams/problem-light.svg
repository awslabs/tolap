<text x="830.0" y="717" fill="#0B1220" font-size="11.5" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">columns · rows · fields · tags · endpoints</text>
<line x1="290.0" y1="638" x2="290.0" y2="680" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-l)"/>
