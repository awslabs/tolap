<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 712" role="img" aria-label="Purpose binding. A signed security context declares a purpose and a delegation chain, both inside the HMAC. Three deterministic checks run in order — resolution filter, action validation, delegation-chain narrowing. Only if all three allow does an optional semantic judge run: it asks whether the call plausibly serves the purpose across the recent trajectory, runs only on a call already allowed, and can only withdraw the allowance, never grant one. Outcome is ALLOW, or DENY/ESCALATE where escalate denies unless a reviewer is wired.">
<rect width="880" height="712" fill="#0D1117"/>
<defs><marker id="ar-pd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9198A1"/></marker></defs>
<rect x="210.0" y="30" width="460" height="64" rx="12" fill="#1E2530" stroke="#30363D" stroke-width="2"/>
<text x="440.0" y="56" fill="#E6EDF3" font-size="15" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">Signed security context</text>
<text x="440.0" y="78" fill="#9198A1" font-size="13" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">declaredPurpose: "campaign-x-overlap" · delegation chain · inside the HMAC</text>
<text x="440.0" y="128" fill="#9198A1" font-size="12.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">The three deterministic checks — same answer every time</text>
<rect x="210.0" y="146" width="460" height="58" rx="10" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/>
<text x="440.0" y="170" fill="#0B1220" font-size="14.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">1 · Resolution filter</text>
<text x="440.0" y="189" fill="#0B1220" font-size="12" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">the purpose must match a policy, or nothing resolves</text>
<rect x="210.0" y="230" width="460" height="58" rx="10" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/>
<text x="440.0" y="254" fill="#0B1220" font-size="14.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">2 · Action validation</text>
<text x="440.0" y="273" fill="#0B1220" font-size="12" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">the tool's action must be allowed for that purpose</text>
<line x1="440.0" y1="204" x2="440.0" y2="230" stroke="#9198A1" stroke-width="2.5" marker-end="url(#ar-pd)"/>
<text x="456.0" y="221" fill="#9198A1" font-size="11" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">pass</text>
<rect x="210.0" y="314" width="460" height="58" rx="10" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/>
<text x="440.0" y="338" fill="#0B1220" font-size="14.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">3 · Delegation chain</text>
<text x="440.0" y="357" fill="#0B1220" font-size="12" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">human → agent → sub-agent — each hop may only narrow</text>
<line x1="440.0" y1="288" x2="440.0" y2="314" stroke="#9198A1" stroke-width="2.5" marker-end="url(#ar-pd)"/>
<text x="456.0" y="305" fill="#9198A1" font-size="11" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">pass</text>
<line x1="440.0" y1="372" x2="440.0" y2="412" stroke="#9198A1" stroke-width="2.5" marker-end="url(#ar-pd)"/>
<text x="456.0" y="396" fill="#9198A1" font-size="11" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">all three allow</text>
<rect x="210.0" y="412" width="460" height="76" rx="12" fill="#1B1E3A" stroke="#6366F1" stroke-width="2" stroke-dasharray="7 5"/>
<text x="440.0" y="437" fill="#A5B4FC" font-size="14.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">4 · Semantic judge   ·   optional</text>
<text x="440.0" y="457" fill="#A5B4FC" font-size="12.5" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">does this call plausibly serve the purpose,</text>
<text x="440.0" y="474" fill="#A5B4FC" font-size="12.5" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">across the recent trajectory — not just this one call?</text>
<text x="440.0" y="512" fill="#9198A1" font-size="11.5" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">Runs only on a call the three checks already allowed · can only take the allowance away, never grant one.</text>
<path d="M440.0 488 L440.0 538 M290.0 538 L590.0 538" fill="none" stroke="#9198A1" stroke-width="2.5"/>
<line x1="290.0" y1="538" x2="290.0" y2="572" stroke="#9198A1" stroke-width="2.5" marker-end="url(#ar-pd)"/>
<text x="200.0" y="560" fill="#9198A1" font-size="11" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">judge agrees</text>
<rect x="165.0" y="572" width="250" height="58" rx="12" fill="#0F766E" stroke="#0F766E" stroke-width="0"/>
<text x="290.0" y="596" fill="#FFFFFF" font-size="15" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">ALLOW</text>
<text x="290.0" y="615" fill="#FFFFFF" font-size="12" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">the call proceeds</text>
<line x1="590.0" y1="538" x2="590.0" y2="572" stroke="#9198A1" stroke-width="2.5" marker-end="url(#ar-pd)"/>
<text x="576.0" y="560" fill="#9198A1" font-size="11" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">judge withdraws</text>
<rect x="465.0" y="572" width="250" height="58" rx="12" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="590.0" y="594" fill="#FFFFFF" font-size="14.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">DENY / ESCALATE</text>
<text x="590.0" y="613" fill="#FFFFFF" font-size="10.5" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">escalate = deny unless a reviewer is wired</text>
</svg>
