<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" role="img" aria-label="Purpose binding. A signed context declaring a purpose and delegation chain runs three deterministic checks in order — resolution filter, action validation, delegation-chain narrowing. Only if all three allow does an optional semantic judge run; it can only withdraw the allowance, never grant one, and escalate denies unless a reviewer is wired.">
<rect width="720" height="690" fill="#FFFFFF"/>
<defs><marker id="ar-pl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs>
<rect x="125.0" y="28" width="470" height="84" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
<text x="360.0" y="55" fill="#0F172A" font-size="15" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">Signed security context</text>
<text x="360.0" y="78" fill="#64748B" font-size="13" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">declaredPurpose: "campaign-x-overlap"</text>
<text x="360.0" y="97" fill="#64748B" font-size="12" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">· delegation chain · signed inside the HMAC</text>
<text x="360.0" y="142" fill="#64748B" font-size="12.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">The three deterministic checks — same answer every time</text>
<rect x="125.0" y="162" width="470" height="58" rx="10" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/>
<text x="360.0" y="186" fill="#0B1220" font-size="14.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">1 · Resolution filter</text>
<text x="360.0" y="205" fill="#0B1220" font-size="12" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">the purpose must match a policy, or nothing resolves</text>
<rect x="125.0" y="246" width="470" height="58" rx="10" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/>
<text x="360.0" y="270" fill="#0B1220" font-size="14.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">2 · Action validation</text>
<text x="360.0" y="289" fill="#0B1220" font-size="12" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">the tool's action must be allowed for that purpose</text>
<line x1="360.0" y1="220" x2="360.0" y2="246" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-pl)"/>
<text x="376.0" y="237" fill="#64748B" font-size="11" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">pass</text>
<rect x="125.0" y="330" width="470" height="58" rx="10" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/>
<text x="360.0" y="354" fill="#0B1220" font-size="14.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">3 · Delegation chain</text>
<text x="360.0" y="373" fill="#0B1220" font-size="12" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">human → agent → sub-agent — each hop may only narrow</text>
<line x1="360.0" y1="304" x2="360.0" y2="330" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-pl)"/>
<text x="376.0" y="321" fill="#64748B" font-size="11" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">pass</text>
<line x1="360.0" y1="388" x2="360.0" y2="428" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-pl)"/>
<text x="376.0" y="412" fill="#64748B" font-size="11" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">all three allow</text>
<rect x="125.0" y="428" width="470" height="74" rx="12" fill="#EEF0FE" stroke="#6366F1" stroke-width="2" stroke-dasharray="7 5"/>
<text x="360.0" y="453" fill="#4338CA" font-size="14.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">4 · Semantic judge   ·   optional</text>
<text x="360.0" y="473" fill="#4338CA" font-size="12.5" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">does this call plausibly serve the purpose,</text>
<text x="360.0" y="490" fill="#4338CA" font-size="12.5" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">across the recent trajectory — not just this one call?</text>
<text x="360.0" y="526" fill="#64748B" font-size="11.5" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">Runs only on a call the three checks already allowed.</text>
<text x="360.0" y="543" fill="#64748B" font-size="11.5" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">It can only take the allowance away — never grant one.</text>
<path d="M360.0 502 L360.0 566 M242.0 566 L478.0 566" fill="none" stroke="#64748B" stroke-width="2.5"/>
<text x="230.0" y="588" fill="#64748B" font-size="11" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="end">judge agrees</text>
<text x="490.0" y="588" fill="#64748B" font-size="11" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="start">judge withdraws</text>
<line x1="242.0" y1="566" x2="242.0" y2="604" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-pl)"/>
<line x1="478.0" y1="566" x2="478.0" y2="604" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar-pl)"/>
<rect x="128.0" y="604" width="228" height="60" rx="12" fill="#0F766E" stroke="#0F766E" stroke-width="0"/>
<text x="242.0" y="629" fill="#FFFFFF" font-size="15" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">ALLOW</text>
<text x="242.0" y="648" fill="#FFFFFF" font-size="12" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">the call proceeds</text>
<rect x="364.0" y="604" width="228" height="60" rx="12" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="478.0" y="627" fill="#FFFFFF" font-size="14.5" font-weight="700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">DENY / ESCALATE</text>
<text x="478.0" y="646" fill="#FFFFFF" font-size="10.5" font-weight="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">escalate = deny unless a reviewer is wired</text>
</svg>
