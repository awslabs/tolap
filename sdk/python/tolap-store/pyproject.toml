[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tolap-store"
version = "1.0.0"
requires-python = ">=3.10"
description = "TOLAP SDK Store - policy storage interfaces and in-memory implementation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Amazon.com, Inc. or its affiliates" }]
keywords = ["tolap", "access-control", "ai-agents", "mcp", "data-masking", "security"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]

# Pinned below the next major: a breaking change in core's models or canonical form
# would break enforcement here, and that must be an explicit upgrade.
dependencies = ["tolap-core>=1.0.0,<2"]

[project.urls]
Homepage = "https://github.com/awslabs/tolap"
Repository = "https://github.com/awslabs/tolap"
Issues = "https://github.com/awslabs/tolap/issues"
Changelog = "https://github.com/awslabs/tolap/blob/main/CHANGELOG.md"

# Explicit rather than inferred. Hatchling can guess the package directory from the
# project name, but the directory here is tolap_store while the project is tolap-store;
# naming it removes the guess. `license-files` and `readme` resolve relative to THIS
# file, which is why LICENSE, NOTICE and README.md are committed in this directory --
# a wheel built without them omits the license silently, with no build error.
[tool.hatch.build.targets.wheel]
packages = ["tolap_store"]

[tool.hatch.build.targets.sdist]
include = ["tolap_store", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
